<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hero MiniGame</title>
    
    <link rel="stylesheet" href="MiniGame.css">
</head>
<body>
    
    <div id = "player" class="circle"></div>

    <div class="jostik">
        <div class="jostik_top">
            <button id = "jostik-up" class = "jostik-btn">↑</button>
        </div>

            <button id = "jostik-rigth" class = "jostik-btn">→</button>


        </div>
    </div>


    <script src="MiniGame.js"></script>
</body>
</html>
